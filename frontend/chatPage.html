<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Plangen AI - Chat</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="chat-page">

  <header>
    <a href="#" class="logo">
      <span class="logo-inner">PLANGEN</span>
    </a>
    <nav class="main-nav">
      <a href="#">Projects</a>
      <a href="#">Design</a>
      <a href="#">Analyze</a>
      <a href="#">Documents</a>
      <a href="#">About</a>
    </nav>
    <div class="header-icons">
      <svg viewBox="0 0 24 24"><path d="M4 4h4v4H4zM16 4h4v4h-4zM4 16h4v4H4zM16 16h4v4h-4zM10 4h4v4h-4zM4 10h4v4H4zM10 10h4v4h-4zM16 10h4v4h-4zM10 16h4v4h-4z"/></svg>
      <svg viewBox="0 0 24 24"><path d="M12 15a3 3 0 100-6 3 3 0 000 6z"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-2 2 2 2 0 01-2-2v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83 0 2 2 0 010-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 01-2-2 2 2 0 012-2h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 010-2.83 2 2 0 012.83 0l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V3a2 2 0 012-2 2 2 0 012 2v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 0 2 2 0 010 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 012 2 2 2 0 01-2 2h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
      <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
    </div>
  </header>

  <main class="chat-layout">
    <div class="chat-intro" id="chat-intro">
      <div class="intro-subtitle">
        <span class="line"></span>
        PLAN. GENERATE. VISUALIZE.
        <span class="line"></span>
      </div>
      <h1>PLANGEN AI ASSISTANT</h1>
      <div class="decorative-diamond">
        <svg viewBox="0 0 24 24" width="24" height="24"><path d="M12 2L15 12L12 22L9 12Z" fill="currentColor"/><circle cx="12" cy="12" r="2" fill="#f5f5f5"/></svg>
      </div>
      <p>
        Your intelligent partner in architectural design.<br>
        Ask anything. Generate ideas. Build better.
      </p>
    </div>

    <div class="blueprint-gallery" id="blueprint-gallery">
      <div class="blueprint-item item-taj">
        <img src="assets/Taj Mahal.png" alt="Taj Mahal Blueprint">
      </div>
      <div class="blueprint-item item-temple">
        <img src="assets/temple copy.png" alt="Temple Blueprint">
      </div>
      <div class="blueprint-item item-statue">
        <img src="assets/Statue.png" alt="Statue of Liberty Blueprint">
      </div>
    </div>

    <!-- Hidden Chat Window -->
    <div class="chat-glass-window" id="chat-glass-window">
      <div class="chat-body" id="chat-body"></div>
    </div>
  </main>

  <div class="search-bar-wrapper">
    <div class="search-bar-inner">
      <button class="icon-btn">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
      </button>
      
      <input type="text" class="search-input" placeholder="Ask Plangen AI anything about architecture...">
      
      <button class="icon-btn paperclip">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
      </button>
      
      <button class="btn-send">SEND &rarr;</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
